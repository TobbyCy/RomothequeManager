name: PERSIST01 temporary lockfile generation
on:
  push:
    branches: [dev1/persist01-sqlite-fixtures]
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Resolve lockfiles (no code execution)
        shell: pwsh
        run: |
          dotnet restore src/RomothequeManager.V2/RomothequeManager.V2.csproj -r win-x64 --force-evaluate -p:SelfContained=true -p:NuGetAudit=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/dotnet/RomothequeManager.V2.Tests/RomothequeManager.V2.Tests.csproj -r win-x64 --force-evaluate -p:NuGetAudit=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import base64
          from pathlib import Path
          for label, path in [
              ("APP", Path("src/RomothequeManager.V2/packages.lock.json")),
              ("TEST", Path("tests/dotnet/RomothequeManager.V2.Tests/packages.lock.json"))
          ]:
              print("PERSIST_LOCK_" + label + "=" + base64.b64encode(path.read_bytes()).decode("ascii"))
          '@ | python -
