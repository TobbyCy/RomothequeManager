name: NEXT05 G1 temporary causal guard mutation (fixtures only)
on:
  push:
    branches: [dev1/next05-g1-perm-fixtures]
    paths:
      - '.github/workflows/next05-g1-mutant-canary.yml'
permissions:
  contents: read
jobs:
  mutation:
    if: github.repository == 'TobbyCy/RomothequeManager'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact HEAD without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned .NET SDK 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Mutation proof in a disposable copy with both real red oracles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'G1_MUTATION_SHA_MISMATCH' }
          $scratch = Join-Path $env:RUNNER_TEMP ('G1-CAS-MUTATION-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $scratch | Out-Null
          try {
            # Only the copied sources are ever changed. Never touch checkout, branch,
            # user devices, or any filesystem outside generated runner fixtures.
            & robocopy $env:GITHUB_WORKSPACE $scratch /E /XD '.git' 'bin' 'obj' /XF '*.zip' | Out-Null
            if ($LASTEXITCODE -ge 8) { throw ('G1_SCRATCH_COPY_FAIL:' + $LASTEXITCODE) }
            $test = Join-Path $scratch 'tests/dotnet/RomothequeManager.V2.Tests/RomothequeManager.V2.Tests.csproj'
            & dotnet restore $test --locked-mode -p:NuGetAudit=true
            if ($LASTEXITCODE -ne 0) { throw 'G1_MUTATION_RESTORE_FAILED' }
            $needle = 'Interlocked.CompareExchange(ref _claimed, 1, 0) == 0'
            function Assert-RedMutant([string]$relative, [string]$testName, [string]$marker) {
              $file = Join-Path $scratch $relative
              $original = [IO.File]::ReadAllText($file)
              if ([regex]::Matches($original, [regex]::Escape($needle)).Count -ne 1) {
                throw ('G1_MUTANT_GUARD_NOT_UNIQUE:' + $relative)
              }
              try {
                [IO.File]::WriteAllText($file,
                  $original.Replace($needle, 'true /* G1_TEMP_MUTANT_ATOMIC_CAS_DISABLED */'),
                  [Text.UTF8Encoding]::new($false))
                Write-Host ('G1_MUTANT_APPLIED_UNDER_RUNNER_TEMP only=' + $relative)
                $output = (& dotnet test $test -c Release --no-restore --filter ("FullyQualifiedName~" + $testName) --logger 'console;verbosity=normal' 2>&1 | Out-String)
                $status = $LASTEXITCODE
                Write-Host $output
                if ($status -eq 0) { throw ('G1_MUTANT_UNDETECTED:' + $testName) }
                if (-not $output.Contains($marker)) {
                  throw ('G1_MUTANT_UNEXPECTED_FAILURE:' + $testName)
                }
                Write-Host ('G1_MUTATION_KILLED_PASS target=' + $testName + ' expected_red_marker=' + $marker)
              }
              finally { [IO.File]::WriteAllText($file, $original, [Text.UTF8Encoding]::new($false)) }
            }
            Assert-RedMutant 'src/RomothequeManager.V2/RsAWindowsRomScanner.cs' 'PERM_G1_REPLAY_RSA_SecondDirectScanWithSameLiveGrantMustBeDenied' 'P1_G1_RSA_ONE_SHOT_BYPASS'
            Assert-RedMutant 'src/RomothequeManager.V2/MiAWindowsMediaScanner.cs' 'PERM_G1_REPLAY_MIA_SecondDirectScanWithSameLiveGrantMustBeDenied' 'P1_G1_MIA_ONE_SHOT_BYPASS'
            Write-Host ('G1_CAUSAL_MUTATIONS_BOTH_KILLED_PASS source=' + $env:GITHUB_SHA + ' disposable=1')
          }
          finally {
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }
