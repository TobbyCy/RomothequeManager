name: NEXT05 SQLite SQL02 write-path mutation proof TEMP
on:
  push:
    branches: [dev1/next05-g1-perm-fixtures]
    paths:
      - '.github/workflows/next05-sql02-mutation.yml'
permissions:
  contents: read
jobs:
  sql02-mutation:
    if: github.repository == 'TobbyCy/RomothequeManager'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Exact checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Exact pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Mutation SQL02 on disposable copy ONLY; both tests must turn RED
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'SQL02_WRONG_SHA' }
          $scratch = Join-Path $env:RUNNER_TEMP ('SQL02-MUTATION-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $scratch | Out-Null
          try {
            & robocopy $env:GITHUB_WORKSPACE $scratch /E /XD '.git' 'bin' 'obj' | Out-Null
            if ($LASTEXITCODE -ge 8) { throw 'SQL02_COPY_FAILED' }
            $source = Join-Path $scratch 'src/RomothequeManager.V2/CatalogStore.cs'
            $test = Join-Path $scratch 'tests/dotnet/RomothequeManager.V2.Tests/RomothequeManager.V2.Tests.csproj'
            $text = [IO.File]::ReadAllText($source)
            $needle = 'ValidateRelativePaths(snapshot.Observations.Select(o => o.RelativePath));'
            $n = ([regex]::Matches($text,[regex]::Escape($needle))).Count
            if ($n -ne 2) { throw ('SQL02_EXPECTED_TWO_WRITE_GUARDS_COUNT=' + $n) }
            & dotnet restore $test --locked-mode -p:NuGetAudit=true
            if ($LASTEXITCODE -ne 0) { throw 'SQL02_RESTORE_FAILED' }
            [IO.File]::WriteAllText($source,
              $text.Replace($needle,'/* SQL02 TEMP MUTANT removed write-path guard */'),
              [Text.UTF8Encoding]::new($false))
            $mutated = [IO.File]::ReadAllText($source)
            if (([regex]::Matches($mutated,[regex]::Escape($needle))).Count -ne 0) {
              throw 'SQL02_WRITE_GUARD_STILL_PRESENT'
            }
            Write-Host 'SQL02_MUTANT_APPLIED_ONLY_IN_RUNNER_TEMP two_write_guards=removed'
            $output = (& dotnet test $test -c Release --no-restore --filter 'FullyQualifiedName~SQL_02_R|FullyQualifiedName~SQL_02_M' --logger 'console;verbosity=normal' 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $output
            if ($code -eq 0) { throw 'SQL02_MUTANT_UNDETECTED' }
            foreach ($marker in @('Failed SQL_02_R_WriteGuardRejectsTraversalWithValidCounts',
                                    'Failed SQL_02_M_WriteGuardRejectsTraversalWithValidCounts')) {
              if (-not $output.Contains($marker)) { throw ('SQL02_MUTANT_MISSING_RED_ORACLE:' + $marker) }
              Write-Host ('SQL02_MUTATION_KILLED_PASS ' + $marker)
            }
            Write-Host ('SQL02_TWO_MUTATIONS_CAUSALLY_DETECTED_PASS sha=' + $env:GITHUB_SHA)
            $global:LASTEXITCODE = 0
          }
          finally {
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }
