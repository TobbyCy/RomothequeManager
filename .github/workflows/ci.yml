name: Adaptive CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: CI policy / classify and canaries
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      policy: ${{ steps.select.outputs.policy }}
      ps: ${{ steps.select.outputs.ps }}
      dotnet: ${{ steps.select.outputs.dotnet }}
    steps:
      - name: Checkout policy and full Git context
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Positive and negative policy canaries (synthetic only)
        run: python3 -B -m unittest discover -s tests -p test_ci_policy.py -v
      - name: Classify complete Git range
        id: select
        run: python3 -B tests/ci_policy.py classify

  ci-docs:
    name: Documents / paths, security and currency
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Portable document and security gate (no product runtime)
        run: python3 -B tests/ci_policy.py docs

  ci0-static:
    name: CI-0 / Static and source integrity
    needs: [policy, ci-docs]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' && needs.policy.outputs.ps == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Static syntax, sensitive files, source integrity
        shell: powershell
        run: |
          & .\tests\Invoke-CiStatic.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Negative canary - verify syntax failure propagates
        shell: powershell
        run: |
          & .\tests\Invoke-CiNegativeCanary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Snapshot comparison - synthetic PS5.1 fixtures and refusal canaries
        shell: powershell
        run: |
          & .\tests\Invoke-CiSnapshotComparison.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Library and snapshot projection - synthetic PS5.1 fixtures
        shell: powershell
        run: |
          & .\tests\Invoke-CiLibraryProjection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Synthetic PowerShell to UI JSON serialization
        shell: powershell
        run: |
          & .\tests\Invoke-CiUiProjectionSerialization.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: T1 catalogue projection - synthetic PowerShell 5.1 canaries
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'CATALOG_PS51_REQUIRED' }
          & .\tests\Invoke-CiCatalogueProjection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: T3/T4 canonical catalogue - independent DTO validation and negative canaries
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'CATDTO_PS51_REQUIRED' }
          & .\tests\Invoke-CiCanonicalCatalogue.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: T3/T4 real PS5.1 synthetic export to Node consumer and negative canaries
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'CATDTO_PS51_REQUIRED' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'CATDTO_NODE_UNAVAILABLE' }
          $syntheticFile = Join-Path $env:RUNNER_TEMP 'rm-t3-catalogue-synthetic.json'
          try {
            & .\tests\Export-SyntheticCanonicalCatalogue.ps1 -OutputJson $syntheticFile | Out-Null
            if (-not (Test-Path -LiteralPath $syntheticFile -PathType Leaf)) { throw 'CATDTO_SYNTHETIC_EXPORT_MISSING' }
            $env:RM_CANONICAL_EXPORT_JSON = $syntheticFile
            node .\tests\catalogue_t3_consumer.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'CATDTO_NODE_CANARIES_FAILED' }
            # Dev 2's Unicode test consumes these exact producer bytes; it is
            # never replaced by a handcrafted fixture or silently skipped.
            $ui = Join-Path $PWD 'prototype\ui11'
            if (Test-Path -LiteralPath (Join-Path $ui 't2-catalogue-model.js') -PathType Leaf) {
              $unicodeTest = Join-Path $ui 'unicode-producer.test.cjs'
              if (-not (Test-Path -LiteralPath $unicodeTest -PathType Leaf)) { throw 'UI_UNICODE_PRODUCER_TEST_MISSING' }
              node $unicodeTest $syntheticFile
              if ($LASTEXITCODE -ne 0) { throw 'UI_UNICODE_PRODUCER_FAILED' }
            }
          } finally {
            Remove-Item Env:RM_CANONICAL_EXPORT_JSON -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $syntheticFile -Force -ErrorAction SilentlyContinue
          }

      - name: UI prototype - complete Node smoke suite when prototype is present
        shell: powershell
        run: |
          $ui = Join-Path $PWD 'prototype\ui11'
          if (Test-Path -LiteralPath $ui -PathType Container) {
            # Cross-branch textual adapter canary is meaningful only after #28
            # supplies both JS sources. Do not silently skip incomplete UI trees.
            $adapter = Join-Path $ui 'projection-adapter.js'
            $data = Join-Path $ui 'projection-data.js'
            if (-not (Test-Path -LiteralPath $adapter -PathType Leaf) -or
                -not (Test-Path -LiteralPath $data -PathType Leaf)) { throw 'UI_ADAPTER_SOURCES_MISSING' }
            & .\tests\Invoke-CiUiAdapterContract.ps1 -UiAdapterPath $adapter -UiDataPath $data
            if ($LASTEXITCODE -ne 0) { throw 'UI_ADAPTER_TEXTUAL_CANARY_FAILED' }
            node --version
            if ($LASTEXITCODE -ne 0) { throw 'UI_NODE_REQUIRED' }
            $expected = @('smoke.cjs','projection-smoke.cjs','integrated-smoke.cjs')
            if (Test-Path -LiteralPath (Join-Path $ui 't2-catalogue-model.js') -PathType Leaf) {
              $expected += @('t2-catalogue.test.cjs','t4-catalogue.test.cjs',
                'synthetic-import.test.cjs','ui-journey.test.cjs','unicode-producer.test.cjs')
            }
            $actual = @(Get-ChildItem -LiteralPath $ui -Filter '*.cjs' -File | ForEach-Object { $_.Name })
            $actualSorted = @( $actual | Sort-Object )
            $expectedSorted = @( $expected | Sort-Object )
            if (($actualSorted -join '|') -cne ($expectedSorted -join '|')) { throw 'UI_TEST_DISCOVERY_MISMATCH' }
            foreach ($test in $expected) {
              if ($test -ceq 'unicode-producer.test.cjs') {
                # Executed once using real PS5.1 export in the preceding step.
                # The discovery gate still requires this file to exist.
                continue
              }
              node (Join-Path $ui $test)
              if ($LASTEXITCODE -ne 0) { throw ('UI_SMOKE_FAILED:' + $test) }
            }
          } else {
            Write-Host 'UI_NOT_APPLICABLE_NO_PROTOTYPE_IN_TREE'
          }

      - name: VAL-01 real Microsoft Edge headless browser on synthetic file URLs
        shell: powershell
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'EDGE_BROWSER_NODE_MISSING' }
          node .\tests\edge-browser-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'EDGE_BROWSER_SMOKE_FAILED' }

      - name: Documentation currency gate (PR and main)
        shell: powershell
        run: |
          & .\tests\Invoke-CiDocsSync.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Documentation gate negative canary
        shell: powershell
        run: |
          & .\tests\Invoke-CiDocsCanary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ci1-runtime:
    name: CI-1 / Windows PowerShell 5.1 bootstrap
    needs: [policy, ci-docs, ci0-static]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' && needs.policy.outputs.ps == 'true' && needs.ci0-static.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Run isolated bootstrap in powershell.exe
        shell: powershell
        run: |
          $PSVersionTable | Format-Table -AutoSize
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          & .\tests\Invoke-CiSmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ci2-pester:
    name: CI-2 / Pester 4.10.1 synthetic tests
    needs: [policy, ci-docs, ci1-runtime]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' && needs.policy.outputs.ps == 'true' && needs.ci1-runtime.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Detect all Pester suites and reject omissions
        shell: powershell
        run: |
          & .\tests\Invoke-CiPesterDiscovery.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Pester and run synthetic unit tests
        shell: powershell
        run: |
          & .\tests\Invoke-CiPester.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify real Pester suite execution using disposable fixtures
        shell: powershell
        run: |
          & .\tests\Invoke-CiPesterExecutionCanary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate reproducible Pester command coverage (no rate threshold)
        shell: powershell
        run: |
          & .\tests\Invoke-CiPesterCoverage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: E1 negative regression canary
        shell: powershell
        run: |
          & .\tests\Invoke-CiE1NegativeCanary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ci3-e1-integration:
    name: CI-3 / E1 full launcher and path safety
    needs: [policy, ci-docs, ci1-runtime]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' && needs.policy.outputs.ps == 'true' && needs.ci1-runtime.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Run real E1 launcher on disposable synthetic fixtures
        shell: powershell
        run: |
          & .\tests\Invoke-CiE1Integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ci4-preflight-synthetic:
    name: CI-4 / E1 local preflight synthetic PS5.1
    needs: [policy, ci-docs]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' && needs.policy.outputs.ps == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preflight on disposable synthetic fixtures only
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PS5.1 required' }
          & .\tests\Invoke-CiE1PreflightSynthetic.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ci-dotnet:
    name: .NET / locked build and nonempty tests
    needs: [policy, ci-docs]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' && needs.policy.outputs.dotnet == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact sources without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Diagnose Windows SDKs outside the pinned repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            dotnet --list-sdks
            if ($LASTEXITCODE -ne 0) { throw 'DOTNET_PREINSTALLED_SDK_LIST_FAILED' }
            dotnet --info
            if ($LASTEXITCODE -ne 0) { throw 'DOTNET_PREINSTALLED_INFO_FAILED' }
          } finally { Pop-Location }
      - name: Provision exact .NET SDK 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1, commit SHA verified
        with:
          dotnet-version: '10.0.401'
      - name: Require actual projects, locked restore, build and executed tests
        shell: cmd
        run: python -B tests/ci_policy.py dotnet
      - name: Parse DIST-ZIP-01 PowerShell packaging script (no distribution)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/Build-DistZip.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('DIST_ZIP_PS_PARSE_FAILED:' + ($errors | Out-String)) }
          Write-Host 'DIST_ZIP_PS_PARSE_PASS'
      - name: Build and verify quarantined V2-01C self-contained win-x64 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'src/RomothequeManager.V2/RomothequeManager.V2.csproj'
          $stage = Join-Path $env:RUNNER_TEMP 'rm-v2-01c-quarantine'
          $publish = Join-Path $stage 'app'
          $extract = Join-Path $stage 'verified-extract'
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          # Keep the committed NuGet locks and include the .NET runtime.
          dotnet restore $app -r win-x64 --locked-mode -p:SelfContained=true -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'V2C_RUNTIME_PACK_LOCKED_RESTORE_FAILED' }
          dotnet publish $app -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:PublishTrimmed=false -p:TreatWarningsAsErrors=true -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'V2C_PUBLISH_FAILED' }
          foreach ($required in @('RomothequeManager.V2.exe','coreclr.dll','hostfxr.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $required) -PathType Leaf)) { throw ('V2C_SELF_CONTAINED_FILE_MISSING:' + $required) }
          }
          # LIC-ZIP-01 evidence: exact dotnet publish output BEFORE our own legal/POC files.
          $publishFiles = @(Get-ChildItem -LiteralPath $publish -Recurse -File | Sort-Object FullName)
          Write-Host ('PUBLISH_FILE_MANIFEST_BEGIN source=' + $env:GITHUB_SHA + ' count=' + $publishFiles.Count)
          foreach ($file in $publishFiles) {
            $relative = $file.FullName.Substring($publish.Length + 1)
            $version = if ($file.Extension -in @('.dll', '.exe')) { $file.VersionInfo.FileVersion } else { '' }
            $productVersion = if ($file.Extension -in @('.dll', '.exe')) { $file.VersionInfo.ProductVersion } else { '' }
            $record = [ordered]@{
              path = $relative
              sizeBytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              fileVersion = $version
              productVersion = $productVersion
            }
            Write-Host ('PUBLISH_FILE_JSON ' + ($record | ConvertTo-Json -Compress))
          }
          Write-Host ('PUBLISH_FILE_MANIFEST_END source=' + $env:GITHUB_SHA + ' count=' + $publishFiles.Count)
          # LIC-ZIP-01: locate publisher-supplied .NET Windows runtime legal assets.
          $fxrVersion = (Get-Item -LiteralPath (Join-Path $publish 'hostfxr.dll')).VersionInfo.ProductVersion
          $runtimeVersion = '10.0.12'
          $nugetRoot = if (-not [string]::IsNullOrWhiteSpace($env:NUGET_PACKAGES)) { $env:NUGET_PACKAGES } else { Join-Path ([Environment]::GetFolderPath('UserProfile')) '.nuget/packages' }
          $runtimeRoots = @((Join-Path $nugetRoot ('microsoft.netcore.app.runtime.win-x64/' + $runtimeVersion)))
          if (-not [string]::IsNullOrWhiteSpace($env:DOTNET_ROOT)) { $runtimeRoots += (Join-Path $env:DOTNET_ROOT ('packs/Microsoft.NETCore.App.Runtime.win-x64/' + $runtimeVersion)) }
          Write-Host ('DOTNET_RUNTIME_LEGAL_DISCOVERY_BEGIN version=' + $runtimeVersion + ' hostfxr=' + $fxrVersion)
          $found = $false
          foreach ($runtimeRoot in $runtimeRoots) {
            if (-not (Test-Path -LiteralPath $runtimeRoot -PathType Container)) { continue }
            $licenseFiles = @(Get-ChildItem -LiteralPath $runtimeRoot -Recurse -File | Where-Object { $_.Name -ceq 'LICENSE.TXT' })
            $noticeFiles = @(Get-ChildItem -LiteralPath $runtimeRoot -Recurse -File | Where-Object { $_.Name -ceq 'THIRD-PARTY-NOTICES.TXT' })
            if ($licenseFiles.Count -ne 1 -or $noticeFiles.Count -ne 1) { continue }
            foreach ($file in @($licenseFiles[0], $noticeFiles[0])) {
              Write-Host ('DOTNET_RUNTIME_LEGAL_FILE name=' + $file.Name + ' bytes=' + $file.Length + ' sha256=' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + ' source=' + $file.FullName)
            }
            $found = $true
            break
          }
          if (-not $found) { Write-Host 'DOTNET_RUNTIME_LEGAL_DISCOVERY_NOT_FOUND — release remains HOLD' }

          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $publish 'LICENSE') -Force
          $notice = @(
            'ROMothèque Manager V2-01C — POC SYNTHÉTIQUE, lecture seule.'
            'Six jeux fictifs et trois bibliothèques fictives. Aucune ROM, aucun BIOS ni collection réelle.'
            'Aucun scan, export, persistance, installation, élévation ni télémétrie.'
            'Application non signée ; Windows SmartScreen peut afficher un avertissement.'
            'Avalonia et les composants .NET conservent leurs licences respectives.'
            'Notices tierces et essai Windows externe à valider avant toute distribution.'
            'AUCUNE RELEASE : publication interdite sans GO propriétaire distinct.'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $publish 'POC-NOTICE.txt'), ($notice + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          $manifest = [ordered]@{
            schemaVersion = 1
            package = 'RomothequeManager-V2-01C'
            sourceCommit = $env:GITHUB_SHA
            runtimeIdentifier = 'win-x64'
            selfContained = $true
            syntheticOnly = $true
            gameFixtures = 6
            libraryFixtures = 3
            views = @('Dashboard','Collection','GameDetail','Libraries')
            publication = 'HOLD_OWNER_GO'
          }
          [IO.File]::WriteAllText((Join-Path $publish 'POC-MANIFEST.json'), (($manifest | ConvertTo-Json -Depth 4) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          $zip = Join-Path $stage 'RomothequeManager-V2-01C-win-x64.zip'
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'V2C_ZIP_MISSING' }
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $stage 'RomothequeManager-V2-01C-win-x64.zip.sha256'
          $checksumLine = $digest + '  ' + [IO.Path]::GetFileName($zip)
          [IO.File]::WriteAllText($checksum, ($checksumLine + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          if ((Get-Content -LiteralPath $checksum -Raw).Trim() -cne $checksumLine) { throw 'V2C_CHECKSUM_FILE_INVALID' }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) { throw 'V2C_CHECKSUM_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          foreach ($required in @('RomothequeManager.V2.exe','coreclr.dll','hostfxr.dll','LICENSE','POC-NOTICE.txt','POC-MANIFEST.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extract $required) -PathType Leaf)) { throw ('V2C_EXTRACTED_FILE_MISSING:' + $required) }
          }
          $files = @(Get-ChildItem -LiteralPath $extract -Recurse -File)
          if ($files.Count -lt 10) { throw 'V2C_PACKAGE_CONTENT_EMPTY' }
          $forbiddenExtensions = @('.rom','.chd','.iso','.cue','.gdi','.cdi','.nes','.sfc','.smc','.gba','.gbc','.n64','.z64','.nsp','.xci','.wad','.sav','.srm','.pfx','.pem','.p12','.snk')
          foreach ($file in $files) {
            if ($forbiddenExtensions -ccontains $file.Extension.ToLowerInvariant() -or $file.Name -eq '.env') { throw ('V2C_FORBIDDEN_PACKAGE_FILE:' + $file.Name) }
          }
          $publishedPaths = @(Get-ChildItem -LiteralPath $publish -Recurse -File | ForEach-Object { $_.FullName.Substring($publish.Length + 1) })
          $extractedPaths = @($files | ForEach-Object { $_.FullName.Substring($extract.Length + 1) })
          if (@(Compare-Object -ReferenceObject $publishedPaths -DifferenceObject $extractedPaths -CaseSensitive).Count -ne 0) { throw 'V2C_ARCHIVE_FILE_SET_MISMATCH' }
          $extractedManifest = Get-Content -LiteralPath (Join-Path $extract 'POC-MANIFEST.json') -Raw | ConvertFrom-Json
          if ($extractedManifest.sourceCommit -cne $env:GITHUB_SHA -or $extractedManifest.runtimeIdentifier -cne 'win-x64' -or -not $extractedManifest.selfContained -or -not $extractedManifest.syntheticOnly -or $extractedManifest.gameFixtures -ne 6 -or $extractedManifest.libraryFixtures -ne 3 -or ($extractedManifest.views -join ',') -cne 'Dashboard,Collection,GameDetail,Libraries' -or $extractedManifest.publication -cne 'HOLD_OWNER_GO') { throw 'V2C_MANIFEST_INVALID' }
          $start = New-Object Diagnostics.ProcessStartInfo
          $start.FileName = Join-Path $extract 'RomothequeManager.V2.exe'
          $start.Arguments = '--smoke-window'
          $start.WorkingDirectory = $extract
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.Environment['DOTNET_ROOT'] = Join-Path $stage 'unavailable-global-runtime'
          $start.Environment['DOTNET_MULTILEVEL_LOOKUP'] = '0'
          $proc = [Diagnostics.Process]::Start($start)
          try {
            $stdout = $proc.StandardOutput.ReadToEndAsync()
            $stderr = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw 'V2C_EXTRACTED_WINDOW_TIMEOUT' }
            $expectedSmoke = 'POC_WINDOW_OPENED_PASS views=Dashboard,Collection,GameDetail,Libraries fixtures=6 synthetic=1'
            if ($proc.ExitCode -ne 0 -or -not $stdout.Result.Contains($expectedSmoke)) {
              throw ('V2C_EXTRACTED_WINDOW_FAILED exit=' + $proc.ExitCode + ';stdout=' + $stdout.Result + ';stderr=' + $stderr.Result)
            }
            Write-Host $stdout.Result
          } finally { $proc.Dispose() }
          Write-Host ('V2C_ZIP_VERIFIED_PASS sha256=' + $digest + ' sizeBytes=' + (Get-Item $zip).Length + ' files=' + $files.Count + ' source=' + $env:GITHUB_SHA)
          # No artifact upload, Release or public download. The runner temp is destroyed.
          Write-Host 'POC_ZIP_QUARANTINED_NOT_UPLOADED thirdPartyNotices=PENDING ownerReleaseGo=PENDING'

  ci-docfx:
    name: DocFX / Windows XML YAML HTML and API coverage
    needs: [policy, ci-docs]
    if: ${{ always() && needs.policy.result == 'success' && needs.ci-docs.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout no persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact SDK 10.0.401
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Native XML to YAML to HTML and strict site checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'docfx-internal-reference'
          New-Item -ItemType Directory -Force -Path $report | Out-Null
          $sdk = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdk -cne '10.0.401') { throw 'DOCFX_SDK_PIN_FAILED' }
          $app = 'src/RomothequeManager.V2/RomothequeManager.V2.csproj'
          dotnet restore $app --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'DOCFX_RESTORE_FAILED' }
          dotnet build $app -c Release --no-restore -p:GenerateDocumentationFile=true -p:TreatWarningsAsErrors=false 2>&1 | Tee-Object -FilePath (Join-Path $report 'xml-build.log')
          if ($LASTEXITCODE -ne 0) { throw 'DOCFX_XML_BUILD_FAILED' }
          $xml = @(Get-ChildItem 'src/RomothequeManager.V2/bin/Release' -Recurse -Filter 'RomothequeManager.V2.xml' -File)
          if ($xml.Count -lt 1 -or @([regex]::Matches((Get-Content $xml[0].FullName -Raw), '<member name=')).Count -lt 7) { throw 'DOCFX_XML_MISSING_OR_EMPTY' }
          dotnet tool install docfx --tool-path (Join-Path $env:RUNNER_TEMP 'docfx') --version 2.81.0
          if ($LASTEXITCODE -ne 0) { throw 'DOCFX_PINNED_INSTALL_FAILED' }
          $exe = Join-Path (Join-Path $env:RUNNER_TEMP 'docfx') 'docfx.exe'
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '2\.81\.0') { throw 'DOCFX_VERSION_FAILED' }
          & $exe metadata docs/api-reference/docfx.json 2>&1 | Tee-Object -FilePath (Join-Path $report 'metadata.log')
          if ($LASTEXITCODE -ne 0) { throw 'DOCFX_METADATA_FAILED' }
          & $exe build docs/api-reference/docfx.json --warningsAsErrors 2>&1 | Tee-Object -FilePath (Join-Path $report 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'DOCFX_BUILD_FAILED' }
          python -B tools/doc-coverage/check_site.py docs/api-reference
          if ($LASTEXITCODE -ne 0) { throw 'DOCFX_UID_OR_LINK_FAILED' }
          Copy-Item docs/api-reference/site-check.json $report
      - name: Roslyn semantic coverage and real red green canaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore tools/doc-coverage/DocCoverage.csproj
          if ($LASTEXITCODE -ne 0) { throw 'DOC_COVERAGE_RESTORE_FAILED' }
          dotnet run --project tools/doc-coverage/DocCoverage.csproj -c Release --no-restore -- --canaries
          if ($LASTEXITCODE -ne 0) { throw 'DOC_CANARY_FAILED' }
          $base = (git rev-parse 'HEAD^1').Trim()
          if ($LASTEXITCODE -ne 0 -or $base -notmatch '^[a-f0-9]{40}$') { throw 'DOC_BASE_SHA_MISSING' }
          dotnet run --project tools/doc-coverage/DocCoverage.csproj -c Release --no-restore -- --root . --base $base --out (Join-Path $env:RUNNER_TEMP 'docfx-internal-reference')
          if ($LASTEXITCODE -ne 0) { throw 'DOC_COVERAGE_BELOW_CONTRACT' }
      - name: Store only temporary internal DocFX site and coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docfx-internal-reference
          path: |
            ${{ runner.temp }}/docfx-internal-reference/
            docs/api-reference/api/
            docs/api-reference/_site/
          if-no-files-found: error
          retention-days: 3

  ci-policy-gate:
    name: ci-policy-gate
    if: ${{ always() }}
    needs: [policy, ci-docs, ci0-static, ci1-runtime, ci2-pester, ci3-e1-integration, ci4-preflight-synthetic, ci-dotnet, ci-docfx]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout for independent policy recomputation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject omitted, cancelled, skipped or failed required checks
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B tests/ci_policy.py gate
