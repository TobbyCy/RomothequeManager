name: MI-A native Windows canaries (fixture-only evidence)
on:
  push:
    branches: [dev1/next05-mia-windows-fixtures]
    paths:
      - .github/workflows/mia-native-windows-proof.yml

permissions:
  contents: read

jobs:
  windows-mia:
    if: github.repository == 'TobbyCy/RomothequeManager' && github.ref == 'refs/heads/dev1/next05-mia-windows-fixtures'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Read-only exact source checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pinned .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Execute native Windows MI-A01..06, 08 and print TRX actual output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='tests/dotnet/RomothequeManager.V2.Tests/RomothequeManager.V2.Tests.csproj'
          $out=Join-Path $env:RUNNER_TEMP 'mia-native-results'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet restore $p --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'MI_A_LOCKED_RESTORE_FAILED' }
          dotnet test $p -c Release --no-restore --filter 'FullyQualifiedName~MiAWindowsFixtureTests' --logger 'trx;LogFileName=mia.trx' --results-directory $out
          if ($LASTEXITCODE -ne 0) { throw 'MI_A_NATIVE_TESTS_FAILED' }
          @'
          import os, glob, sys, xml.etree.ElementTree as ET
          paths = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "mia-native-results", "*.trx"))
          if len(paths) != 1: sys.exit("MI_A_TRX_MISSING_OR_AMBIGUOUS")
          root = ET.parse(paths[0]).getroot()
          results = [e for e in root.iter() if e.tag.split("}")[-1] == "UnitTestResult"]
          if len(results) != 7: sys.exit("MI_A_EXPECTED_SEVEN_CANARIES:" + str(len(results)))
          for r in results:
              print("MI_A_NATIVE_CASE name=" + str(r.attrib.get("testName")) + " outcome=" + str(r.attrib.get("outcome")))
              for e in r.iter():
                  if e.tag.split("}")[-1] == "StdOut" and e.text:
                      for line in e.text.strip().splitlines():
                          print("MI_A_NATIVE_EVIDENCE " + line.strip())
          if any(r.attrib.get("outcome") != "Passed" for r in results):
              sys.exit("MI_A_NATIVE_CANARY_FAILURE")
          print("MI_A_NATIVE_TRX_7_PASS real_runner_windows=1")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'MI_A_TRX_PROOF_FAILED' }
