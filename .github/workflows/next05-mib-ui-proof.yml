name: NEXT-05 / UI MI-B Windows fixture evidence (DEV3 branch only)
on:
  push:
    branches: [dev3/next05-ui-mib-fixtures]
permissions:
  contents: read
concurrency:
  group: next05-ui-mib-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-mib-ui:
    if: github.repository == 'TobbyCy/RomothequeManager' && github.ref == 'refs/heads/dev3/next05-ui-mib-fixtures' && github.actor == 'TobbyCy'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup pinned .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Locked tests and CI-only build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'MIB_HEAD_MISMATCH' }
          $test='tests/dotnet/RomothequeManager.V2.Tests/RomothequeManager.V2.Tests.csproj'
          $app='src/RomothequeManager.V2/RomothequeManager.V2.csproj'
          dotnet restore $test --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'MIB_TEST_RESTORE_FAILED' }
          dotnet test $test -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'MIB_TESTS_FAILED' }
          dotnet restore $app -r win-x64 --locked-mode -p:SelfContained=true -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'MIB_APP_RESTORE_FAILED' }
          dotnet publish $app -c Release -r win-x64 --self-contained true --no-restore -p:DefineConstants=NEXT05_CI -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:TreatWarningsAsErrors=true -o (Join-Path $env:RUNNER_TEMP 'mib-ci')
          if ($LASTEXITCODE -ne 0) { throw 'MIB_CI_PUBLISH_FAILED' }
      - name: Real Avalonia GUI captures on generated Windows fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'mib-ci/RomothequeManager.V2.exe'
          $p=[Diagnostics.ProcessStartInfo]::new()
          $p.FileName=$exe
          $p.WorkingDirectory=Split-Path $exe
          $p.ArgumentList.Add('--ci-next05-mib-gui')
          $p.UseShellExecute=$false
          $process=[Diagnostics.Process]::Start($p)
          if ($null -eq $process) { throw 'MIB_GUI_NOT_STARTED' }
          try {
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'MIB_GUI_TIMEOUT' }
            if ($process.ExitCode -ne 0) { throw ('MIB_GUI_FAILED:'+ $process.ExitCode) }
          } finally { $process.Dispose() }
          $captures=Join-Path $env:RUNNER_TEMP 'next05-mib-ui-captures'
          $png=@(Get-ChildItem -LiteralPath $captures -File -Filter 'MIB-*.png')
          if ($png.Count -lt 24) { throw ('MIB_CAPTURES_INSUFFICIENT:'+ $png.Count) }
          Add-Type -AssemblyName System.Drawing
          foreach ($file in $png) {
            $bitmap=[Drawing.Bitmap]::FromFile($file.FullName)
            try {
              if ((($bitmap.Width -ne 1120 -or $bitmap.Height -ne 720) -and
                   ($bitmap.Width -ne 760 -or $bitmap.Height -ne 480)) -or $file.Length -lt 4000) {
                throw ('MIB_PNG_INVALID:'+ $file.Name)
              }
            } finally { $bitmap.Dispose() }
          }
          Write-Host ('UI_MIB_NATIVE_CAPTURE_PASS source='+$env:GITHUB_SHA+' count='+$png.Count)
      - name: Standard EXE without CI seam and quarantined ZIP SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app='src/RomothequeManager.V2/RomothequeManager.V2.csproj'
          dotnet clean $app -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'MIB_CLEAN_FAILED' }
          $out=Join-Path $env:RUNNER_TEMP 'mib-product'
          dotnet publish $app -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:TreatWarningsAsErrors=true -o $out
          if ($LASTEXITCODE -ne 0) { throw 'MIB_NORMAL_PUBLISH_FAILED' }
          foreach ($f in @('RomothequeManager.V2.exe','RM_V2_Favicon.ico','RM_V2_Horizontal_Fond_Sombre.png')) {
            if (-not (Test-Path -LiteralPath (Join-Path $out $f) -PathType Leaf)) { throw ('MIB_PRODUCT_MISSING:'+ $f) }
          }
          $inventory='docs/developer/lic-zip-01-inventory.md'
          if (-not (Select-String -LiteralPath $inventory -Pattern 'LIC_ZIP_01_BINARY_DISTRIBUTION_APPROVED' -Quiet)) { throw 'MIB_LICENSE_HOLD' }
          foreach ($f in @('LICENSE','LEGAL.md','BRANDING.md')) { Copy-Item -LiteralPath $f -Destination $out }
          Copy-Item -LiteralPath 'packaging/THIRD-PARTY-NOTICES.txt' -Destination $out
          Copy-Item -LiteralPath $inventory -Destination (Join-Path $out 'THIRD-PARTY-INVENTORY.md')
          Copy-Item -LiteralPath 'packaging/licenses' -Destination (Join-Path $out 'licenses') -Recurse
          [IO.File]::WriteAllText((Join-Path $out 'GUIDE-NEXT05-MIB.txt'),('Fixture-only evidence; source='+$env:GITHUB_SHA+'; real media scan HOLD; no CI entrypoint; no Release.'),[Text.UTF8Encoding]::new($false))
          $files=@(Get-ChildItem -LiteralPath $out -File -Recurse)
          foreach ($file in $files) {
            if (@('.gba','.rom','.chd','.iso','.cue','.m3u','.sav','.nsp','.xci','.wad','.pfx','.pem','.key') -contains $file.Extension.ToLowerInvariant()) { throw 'MIB_FORBIDDEN_PAYLOAD' }
          }
          $captures=Join-Path $env:RUNNER_TEMP 'next05-mib-ui-captures'
          $name='RomothequeManager-NEXT05-MIB-'+$env:GITHUB_SHA.Substring(0,8)+'.zip'
          $zip=Join-Path $captures $name
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($zip+'.sha256'),($sha+'  '+$name+[Environment]::NewLine),[Text.Encoding]::ASCII)
          $extract=Join-Path $env:RUNNER_TEMP 'mib-extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          if (@(Get-ChildItem -LiteralPath $extract -File -Recurse).Count -ne $files.Count) { throw 'MIB_EXTRACT_COUNT_MISMATCH' }
          foreach ($file in $files) {
            $relative=$file.FullName.Substring($out.Length+1)
            $other=Join-Path $extract $relative
            if (-not (Test-Path -LiteralPath $other -PathType Leaf) -or (Get-FileHash -LiteralPath $other -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash) { throw 'MIB_EXTRACT_HASH_MISMATCH' }
          }
          Write-Host ('MIB_QUARANTINED_ZIP_SHA256_PASS source='+$env:GITHUB_SHA+' sha256='+$sha+' files='+$files.Count)
      - name: Upload temporary evidence, not a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NEXT05-UI-MIB-Windows-Fixtures
          path: |
            ${{ runner.temp }}/next05-mib-ui-captures/*.png
            ${{ runner.temp }}/next05-mib-ui-captures/*.zip
            ${{ runner.temp }}/next05-mib-ui-captures/*.sha256
          if-no-files-found: error
          retention-days: 3
