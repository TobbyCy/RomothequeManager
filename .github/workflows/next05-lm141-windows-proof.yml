name: NEXT-05 / LM-141 legacy ES-DE native Windows fixture proof (temporary)
on:
  push:
    branches: [dev1/next05-g1-perm-fixtures]
permissions:
  contents: read
concurrency:
  group: next05-lm141-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-lm141:
    if: github.repository == 'TobbyCy/RomothequeManager'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Exact checkout (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Exact pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - name: Locked build, tests, synthetic GUI only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'LM_WRONG_COMMIT' }
          $test = 'tests/dotnet/RomothequeManager.V2.Tests/RomothequeManager.V2.Tests.csproj'
          $app  = 'src/RomothequeManager.V2/RomothequeManager.V2.csproj'
          dotnet restore $test --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'LM_DOTNET_LOCKED_RESTORE_FAILED' }
          dotnet test $test -c Release --no-restore -p:TreatWarningsAsErrors=true --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw 'LM_DOTNET_TESTS_FAILED' }
          dotnet restore $app -r win-x64 --locked-mode -p:SelfContained=true -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'LM_GUI_LOCKED_RESTORE_FAILED' }
          $output = Join-Path $env:RUNNER_TEMP 'LM141-ci-app'
          dotnet publish $app -c Release -r win-x64 --self-contained true --no-restore -p:DefineConstants=NEXT05_CI -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -p:TreatWarningsAsErrors=true -o $output
          if ($LASTEXITCODE -ne 0) { throw 'LM_GUI_PUBLISH_FAILED' }
          $exe = Join-Path $output 'RomothequeManager.V2.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'LM_GUI_EXE_NOT_FOUND' }
          Write-Host ('LM141_BUILD_AND_TEST_PASS source=' + $env:GITHUB_SHA)
      - name: Create a genuine small JPEG on the Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $bmp = [Drawing.Bitmap]::new(96,64)
          $canvas = [Drawing.Graphics]::FromImage($bmp)
          try {
            $canvas.Clear([Drawing.Color]::DarkBlue)
            $jpeg = Join-Path $env:RUNNER_TEMP 'lm-valid-synthetic.jpg'
            $bmp.Save($jpeg,[Drawing.Imaging.ImageFormat]::Jpeg)
          } finally { $canvas.Dispose(); $bmp.Dispose() }
          if ((Get-Item $jpeg).Length -lt 100) { throw 'LM_JPEG_NOT_CREATED' }
          Write-Host ('LM03_JPEG_NATIVE_FIXTURE_PASS bytes=' + (Get-Item $jpeg).Length)
      - name: Actual Avalonia 50-card UI, guards, navigation and memory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'LM141-ci-app/RomothequeManager.V2.exe'
          $psi = [Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.WorkingDirectory = Split-Path $exe
          $psi.ArgumentList.Add('--ci-next05-legacy-media')
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($psi)
          if ($null -eq $process) { throw 'LM_WINDOWS_GUI_FAILED_TO_START' }
          try {
            if (-not $process.WaitForExit(210000)) {
              $process.Kill($true)
              throw 'LM_WINDOWS_GUI_TIMEOUT'
            }
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            Write-Host $stdout
            if ($stderr) { Write-Host $stderr }
            if ($process.ExitCode -ne 0) { throw ('LM_WINDOWS_GUI_EXIT_' + $process.ExitCode) }
            foreach ($marker in @('LM01_LM02_LM06_NATIVE_WINDOWS_PASS',
                'LM03_PNG_JPEG_GUARDED_DECODE_PASS',
                'LM03_ACTUAL_COVERFOR_AND_GALLERY_PASS',
                'LM04_NATIVE_50_CARDS_PASS',
                'LM05_NATIVE_20_RAPID_NAVIGATIONS_PASS',
                'LM05_DISPOSE_PASS',
                'LM_01_02_03_04_05_06_07_WINDOWS_FIXTURES_PASS')) {
              if (-not $stdout.Contains($marker)) { throw ('LM_NATIVE_ORACLE_MISSING:' + $marker) }
            }
          } finally { $process.Dispose() }
          $out = Join-Path $env:RUNNER_TEMP 'LM141-Windows-PNG'
          $captures = @(Get-ChildItem -LiteralPath $out -Filter '*.png' -File)
          if ($captures.Count -ne 14) { throw ('LM_PNG_COUNT_' + $captures.Count) }
          Add-Type -AssemblyName System.Drawing
          foreach ($png in $captures) {
            $b = [Drawing.Bitmap]::FromFile($png.FullName)
            try {
              if ($b.Width -lt 760 -or $b.Height -lt 480 -or $png.Length -lt 4000) {
                throw ('LM_BAD_NATIVE_CAPTURE:' + $png.Name)
              }
            } finally { $b.Dispose() }
          }
          $list = @($captures | Sort-Object Name | ForEach-Object {
            [ordered]@{name=$_.Name;bytes=$_.Length;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          [ordered]@{source=$env:GITHUB_SHA;nativeWindows=$true;syntheticOnly=$true;release=$false;png=$list} |
            ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'LM141-PROOF.json') -Encoding utf8
          Write-Host ('LM141_WINDOWS_14_PNG_PASS source='+$env:GITHUB_SHA+' synthetic_only=true')
      - name: Upload short-lived Windows proof (no user data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LM141-Windows-Fictional-PNG
          path: |
            ${{ runner.temp }}/LM141-Windows-PNG/*
          retention-days: 3
          if-no-files-found: warn
