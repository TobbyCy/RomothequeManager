{
  "name": "Bug reproductible",
  "description": "Signaler un problème sur une version disponible, sans données personnelles.",
  "title": "[Bug] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "ROMothèque Manager est en développement. N'incluez ni ROM, BIOS, XML ES-DE réel, StateRoot, secrets, identifiant de machine ni capture/chemin personnel. Aucune Issue n'autorise une opération réelle. Une vulnérabilité doit suivre SECURITY.md via un canal privé effectivement confirmé, jamais ce formulaire."
      }
    },
    {
      "type": "textarea",
      "id": "version",
      "attributes": {
        "label": "Version/commit, Windows/OS et contexte",
        "description": "Indiquer inconnu si impossible à reproduire, pas de chemin utilisateur."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Étapes sur fixtures fictives",
        "description": "Décrire la reproduction sans ROM/BIOS ni copie d'un disque réel."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Résultat attendu",
        "description": "Comportement défini et source technique si connue."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "observed",
      "attributes": {
        "label": "Résultat observé et preuve expurgée",
        "description": "Distinguer test réalisé, constat rapporté et inconnu."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "impact",
      "attributes": {
        "label": "Impact, limites et contournement sûr",
        "description": "Un bug non reproduit ne vaut pas incident critique."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Vérifications",
        "options": [
          {
            "label": "Mes exemples et preuves sont fictifs ou expurgés.",
            "required": true
          },
          {
            "label": "Je ne demande aucune action réelle implicite sur les bibliothèques.",
            "required": true
          }
        ]
      }
    }
  ]
}
