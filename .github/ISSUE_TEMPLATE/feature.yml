{
  "name": "Fonctionnalité proposée",
  "description": "Décrire un besoin utilisateur sans affirmer son implémentation.",
  "title": "[Fonctionnalité] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "ROMothèque Manager est en développement. N'incluez ni ROM, BIOS, XML ES-DE réel, StateRoot, secrets, identifiant de machine ni capture/chemin personnel. Aucune Issue n'autorise une opération réelle. Une vulnérabilité doit suivre SECURITY.md via un canal privé effectivement confirmé, jamais ce formulaire."
      }
    },
    {
      "type": "textarea",
      "id": "need",
      "attributes": {
        "label": "Besoin utilisateur",
        "description": "Quel problème ou confort apporte la fonctionnalité ?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "scope",
      "attributes": {
        "label": "Périmètre et exclusions",
        "description": "Préciser les usages et ce qui n'est pas autorisé."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "criteria",
      "attributes": {
        "label": "Critères observables et cas négatifs",
        "description": "Inclure Offline/Stale/unknown/partial lorsqu'applicable."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "options",
      "attributes": {
        "label": "Alternatives et inconnus",
        "description": "Aucune stack ni API adoptée tacitement."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Dépendances, confidentialité et documentation",
        "description": "Aucun lien vers une zone privée."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Vérifications",
        "options": [
          {
            "label": "Mes exemples et preuves sont fictifs ou expurgés.",
            "required": true
          },
          {
            "label": "Je ne demande aucune action réelle implicite sur les bibliothèques.",
            "required": true
          }
        ]
      }
    }
  ]
}
